<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон со скруглением в стиле иконок Apple -->
  <rect width="512" height="512" rx="128" fill="url(#gradient)"/>
  
  <!-- Инициалы -->
  <text x="50%" y="54%" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="240" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" letter-spacing="-10">
    AS
  </text>
  
  <!-- Тот самый сине-бирюзовый градиент -->
  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/> <!-- blue-600 -->
      <stop offset="1" stop-color="#06B6D4"/> <!-- cyan-500 -->
    </linearGradient>
  </defs>
</svg>
